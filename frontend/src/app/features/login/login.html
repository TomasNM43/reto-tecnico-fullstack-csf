<div class="login-fondo d-flex align-items-center justify-content-center min-vh-100 bg-light px-3">
  <div class="card shadow-sm w-100" style="max-width: 400px">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-1">Clínica San Felipe</h1>
      <p class="text-muted text-center mb-4">Inicia sesión para continuar</p>

      @if (error(); as mensaje) {
        <div class="alert alert-danger py-2" role="alert">{{ mensaje }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input
            id="username"
            type="text"
            class="form-control"
            formControlName="username"
            autocomplete="username"
            [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
          />
          <div class="invalid-feedback">Ingresa tu usuario.</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
          />
          <div class="invalid-feedback">Ingresa tu contraseña.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          }
          Ingresar
        </button>
      </form>
    </div>
  </div>
</div>
